[blog]
user = momo
group = momo
listen = /run/php/blog.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
php_admin_value[open_basedir] = /var/www/blog:/var/lib/typecho:/tmp
php_admin_value[expose_php] = On
php_admin_value[session.save_path] = /tmp
request_terminate_timeout = 120
php_admin_value[session.upload_progress.cleanup] = Off
php_admin_value[session.use_strict_mode] = 0
php_admin_value[session.use_only_cookies] = 0
